<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Animated knowledge decay curve with spaced revision points">
  <style>
    .axis { stroke: #94a3b8; stroke-width: 2; }
    .decay { stroke: #f43f5e; stroke-width: 4; fill: none; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 6s ease-in-out infinite; }
    .boost { stroke: #10b981; stroke-width: 4; fill: none; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 6s ease-in-out infinite; animation-delay: .3s; }
    .rev { fill: #6366f1; animation: pop 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; opacity: 0; }
    .lbl { font: 600 12px system-ui, sans-serif; fill: #475569; }
    @keyframes draw { 0% { stroke-dashoffset: 700; } 80%, 100% { stroke-dashoffset: 0; } }
    @keyframes pop { 0%,15% { opacity: 0; transform: scale(.3); } 25%, 100% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .decay, .boost { stroke-dashoffset: 0; } .rev { opacity: 1; } }
  </style>

  <rect width="560" height="300" rx="20" fill="#f8fafc"/>
  <line class="axis" x1="60" y1="250" x2="530" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="60" y2="40"/>
  <text class="lbl" x="66" y="58">Recall strength</text>
  <text class="lbl" x="440" y="272">Days</text>

  <!-- Without revision: forgetting curve -->
  <path class="decay" d="M60 70 C 120 150, 170 200, 260 225 S 420 240, 530 246"/>
  <!-- With spaced revision: strength rebounds -->
  <path class="boost" d="M60 70 C 90 110, 120 120, 150 110 S 190 80, 230 100 S 300 80, 380 88 S 480 70, 530 72"/>

  <!-- Revision points -->
  <circle class="rev" cx="150" cy="110" r="7"/>
  <circle class="rev" cx="230" cy="100" r="7" style="animation-delay:.4s"/>
  <circle class="rev" cx="380" cy="88" r="7" style="animation-delay:.8s"/>

  <text class="lbl" x="150" y="98" text-anchor="middle">Review 1</text>
  <text class="lbl" x="380" y="76" text-anchor="middle">Review 3</text>
  <text class="lbl" x="400" y="222" style="fill:#e11d48">Forgotten without review</text>
  <text class="lbl" x="400" y="50" style="fill:#047857">With spaced retrieval</text>
</svg>
