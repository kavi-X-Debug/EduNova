<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Animated quest map: a learner moves along a path toward a flag">
  <style>
    .trail { stroke: #94a3b8; stroke-width: 6; fill: none; stroke-dasharray: 2 14; stroke-linecap: round; }
    .done-trail { stroke: #f97316; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 400; animation: grow 4s ease-in-out infinite; }
    .hero { animation: bob 1.2s ease-in-out infinite; }
    .star { fill: #facc15; animation: twinkle 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .flag { animation: wave 1.5s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
    .label { font: 600 13px system-ui, sans-serif; fill: #7c2d12; }
    @keyframes grow { 0% { stroke-dashoffset: 400; } 70%, 100% { stroke-dashoffset: 0; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: .6; } }
    @keyframes wave { 0%,100% { transform: skewY(0deg); } 50% { transform: skewY(-8deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .done-trail { stroke-dashoffset: 0; } }
  </style>

  <rect width="480" height="300" rx="20" fill="#fff7ed"/>
  <path class="trail" d="M50 230 C 120 230, 120 150, 200 150 S 300 80, 380 90"/>
  <path class="done-trail" d="M50 230 C 120 230, 120 150, 200 150"/>

  <!-- Completed mission nodes -->
  <circle cx="50" cy="230" r="10" fill="#f97316"/>
  <circle cx="200" cy="150" r="10" fill="#f97316"/>
  <text x="50" y="256" class="label">Start</text>
  <text x="200" y="176" class="label">Mission 1 ✓</text>

  <!-- Current learner -->
  <g class="hero">
    <circle cx="200" cy="112" r="16" fill="#fb923c"/>
    <circle cx="194" cy="110" r="2.5" fill="#7c2d12"/>
    <circle cx="206" cy="110" r="2.5" fill="#7c2d12"/>
    <path d="M194 118 Q200 123 206 118" stroke="#7c2d12" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Goal flag -->
  <line x1="380" y1="90" x2="380" y2="40" stroke="#7c2d12" stroke-width="3"/>
  <path class="flag" d="M380 40 L420 52 L380 64 Z" fill="#e11d48"/>
  <text x="330" y="28" class="label">Quest goal</text>

  <!-- Sparkles -->
  <circle class="star" cx="120" cy="90" r="5"/>
  <circle class="star" cx="300" cy="200" r="4" style="animation-delay:.7s"/>
  <circle class="star" cx="440" cy="180" r="5" style="animation-delay:1.3s"/>
</svg>
