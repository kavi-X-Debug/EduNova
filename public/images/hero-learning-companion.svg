<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustration of a student learning with a friendly AI companion and floating subject icons">
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 7s ease-in-out infinite reverse; }
    .blink { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    .t { font: 700 15px system-ui, sans-serif; fill: #1e1b4b; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="640" cy="110" r="70" fill="#fde68a" opacity=".6"/>

  <!-- Desk -->
  <rect x="120" y="380" width="560" height="22" rx="11" fill="#6366f1"/>
  <rect x="180" y="402" width="16" height="90" fill="#4338ca"/>
  <rect x="604" y="402" width="16" height="90" fill="#4338ca"/>

  <!-- Book stack -->
  <rect x="520" y="346" width="120" height="18" rx="4" fill="#f43f5e"/>
  <rect x="530" y="328" width="104" height="18" rx="4" fill="#10b981"/>
  <rect x="524" y="310" width="112" height="18" rx="4" fill="#f59e0b"/>

  <!-- Student -->
  <g>
    <rect x="300" y="250" width="130" height="135" rx="40" fill="#0ea5e9"/>
    <circle cx="365" cy="200" r="58" fill="#fcd9b0"/>
    <path d="M305 190 Q365 110 428 190 Q420 150 365 146 Q312 150 305 190 Z" fill="#1e1b4b"/>
    <g class="blink">
      <circle cx="343" cy="204" r="6" fill="#1e1b4b"/>
      <circle cx="387" cy="204" r="6" fill="#1e1b4b"/>
    </g>
    <path d="M345 226 Q365 242 385 226" stroke="#9a3412" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="250" y="300" width="60" height="18" rx="9" fill="#fcd9b0"/>
    <rect x="254" y="318" width="60" height="18" rx="9" fill="#fcd9b0" transform="translate(-10 -6)"/>
    <rect x="290" y="306" width="150" height="80" rx="6" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
    <path d="M315 330 L360 330 M315 346 L420 346" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- AI companion (friendly orb) -->
  <g class="float">
    <circle cx="520" cy="230" r="52" fill="#6366f1"/>
    <circle cx="520" cy="230" r="52" fill="none" stroke="#a5b4fc" stroke-width="6" opacity=".5"/>
    <circle cx="502" cy="222" r="7" fill="#ffffff"/>
    <circle cx="538" cy="222" r="7" fill="#ffffff"/>
    <path d="M500 246 Q520 262 540 246" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="520" y="312" text-anchor="middle" class="t">Sahayaka</text>
  </g>

  <!-- Floating subject tiles -->
  <g class="float-b">
    <rect x="92" y="120" width="112" height="56" rx="14" fill="#ffffff"/>
    <text x="148" y="154" text-anchor="middle" class="t">Maths ∑</text>
  </g>
  <g class="float">
    <rect x="610" y="170" width="120" height="56" rx="14" fill="#ffffff"/>
    <text x="670" y="204" text-anchor="middle" class="t">Science ⚗</text>
  </g>
  <g class="float-b">
    <rect x="96" y="260" width="126" height="56" rx="14" fill="#ffffff"/>
    <text x="159" y="294" text-anchor="middle" class="t">தமிழ் · සිංහල</text>
  </g>

  <!-- Learning Twin progress bar -->
  <g>
    <rect x="260" y="60" width="280" height="22" rx="11" fill="#ffffff"/>
    <rect x="260" y="60" width="196" height="22" rx="11" fill="#10b981"/>
    <text x="400" y="50" text-anchor="middle" class="t">Learning Twin · 70% mastery</text>
  </g>
</svg>
